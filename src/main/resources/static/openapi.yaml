openapi: 3.0.3
info: 
    title: SamSebeMehanik
    description: API для проекта
    version: 1.0.0
    contact:
        name: Project
        email: konstantin96@list.ru
    license:
        name: MIT
servers: 
    - url: http://localhost:8080

tags:
  - name: Auth
    description: Аутентификация и авторизация
  - name: Компонент
    description: Действия с компонентами
  - name: Меню
    description: Менюшка слева
  - name: Пользователь
    description: Работа с пользователем

paths: 
    /api/v1/autocomponents:
        post:
            summary: Создать компонент с уникальным id
            tags: [Компонент]
            security: 
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ComponentCreateRequest'
                        example:
                          "name": "Двигатель"
                          "description": "Сердце автомобиля. Преобразует химическую энергию топлива (бензина, дизеля, газа) в механическую работу путём его сжигания непосредственно внутри рабочих цилиндров"
                          "specification": "Смесь топлива и воздуха сгорает внутри цилиндров, создавая высокое давление, которое толкает поршень, а тот вращает коленвал"
                          "specification_jsonB": null
            responses:
                '201':
                    description: Компонент создан
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ComponentCreateResponse' 
                '400':
                    description: Ошибка валидации
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse' 
        get:
            summary: Получить все автокомпоненты
            tags: [Компонент]
            parameters:
                - name: page
                  in: query
                  schema: 
                      type: integer
                      example: 0
                - name: size
                  in: query
                  schema:
                      type: integer
                      example: 20
            responses:
                '200':
                    description: Компоненты успешно получены
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ComponentPageResponse'
    /api/v1/autocomponents/{id}:
        put:
            summary: Отредактировать компонент с указанным id
            tags: [Компонент]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: uuid
                    
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ComponentEditRequest'
                        example:
                          "name": "Двигатель"
                          "description": "Разновидность теплового двигателя, в котором топливная смесь сгорает непосредственно в рабочей камере (внутри) двигателя."
                          "specification": "Продукты сгорания образуют рабочее тело. Такой двигатель является первичным, химическим, и преобразует энергию сгорания топлива в механическую работу."
                          "specification_jsonB": null
            responses:
                '200':
                    description: Компонент изменен успешно
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ComponentEditResponse' 
                '400':
                    description: Ошибка валидации
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse' 
                '500':
                    description: Внутренняя ошибка сервера
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse'
                '404':
                    description: Ресурс не найден
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse' 
        get:
            summary: Получить единицу компонента по его id
            tags: [Компонент]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                '200':
                    description: Компонент успешно получен
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ComponentResponse'
                '400':
                    description: Некорректный идентификатор компонента
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse' 
                '404':
                    description: Ресурс не найден
                    content:
                        application/json:
                            schema:
                               $ref: '#/components/schemas/ComponentErrorResponse' 
    /api/v1/leftMenu:
        get:
            summary: Меню для автокомпонентов
            tags: [Меню]
            responses:
                '200':
                    description: Меню успешно получено
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/MenuResponse'
                                    
    /auth/register:
        post:
            summary: Регистрация нового пользователя
            tags: [Auth]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
            responses:
                '201':
                    description: Пользователь успешно зарегистрирован
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse' 
                '400':
                    description: Ошибка валидации данных
                '404':
                    description: Пользователь с таким логином уже существует
                    
    /auth/login:
        post:
            summary: Авторизация пользователя
            tags: [Auth]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Успешная авторизация
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse' 
                '401':
                    description: Неверный логин или пароль

    /auth/refresh:
        post:
            summary: Обновление access токена
            tags: [Auth]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
            responses:
                '200':
                    description: Токен успешно обновлен
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse' 
                '401':
                    description: Невалидный refresh токен
                    
    /users/me:
        post:
            summary: Данные пользователя
            tags: [Пользователь]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserResponse'
            responses:
                '200':
                    description: Токен успешно обновлен
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse' 
                '401':
                    description: Не авторизован

components:
    schemas:
        ComponentCreateRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 2
                description:
                    type: string
                specification:
                    type: string
                specification_jsonB:
                    type: object
                    additionalProperties: true
        ComponentCreateResponse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                description:
                    type: string
                specification:
                    type: string
                specification_jsonB:
                    type: object
                    additionalProperties: true
        ComponentErrorResponse:
            type: object
            properties:
                code: 
                    type: string
                message:
                    type: string
                details:
                    type: array
                    items:
                        type: string
        ComponentEditRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 2
                description:
                    type: string
                specification:
                    type: string
                specification_jsonB:
                    type: object
                    additionalProperties: true
        ComponentEditResponse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                description:
                    type: string
                specification:
                    type: string
                specification_jsonB:
                    type: object
                    additionalProperties: true
        ComponentResponse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
                description:
                    type: string
                specification:
                    type: string
                specification_jsonB:
                    type: object
                    additionalProperties: true
                    
                relations:
                    type: object
                    properties:
                        partOf:
                            type: array
                            items:
                                $ref: '#/components/schemas/RelatedComponent'
                                
                        hasParts:
                            type: array
                            items:
                                $ref: '#/components/schemas/RelatedComponent'
                                
                        interactsWith:
                            type: array
                            items:
                                $ref: '#/components/schemas/RelatedComponent'
        RelatedComponent:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                name:
                    type: string
        MenuResponse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
        ComponentPageResponse:
            type: object
            properties:
                content:
                    type: array
                    items:
                        $ref: '#/components/schemas/ComponentResponse'
                page:
                    type: integer
                    example: 0
                size:
                    type: integer
                    example: 20
                totalElements:
                    type: integer
                    example: 134
                totalPages:
                    type: integer
                    example: 7
                    
        RegisterRequest:
            type: object
            required:
                - login
                - password
            properties:
                login:
                    type: string
                password:
                    type: string
                    format: password
                    
        LoginRequest:
            type: object
            required:
                - login
                - password
            properties:
                login:
                    type: string
                password:
                    type: string
                    format: password

        RefreshRequest:
            type: object
            required:
                - refreshToken
            properties:
                refreshToken:
                    type: string

        AuthResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string
                user:
                    $ref: '#/components/schemas/UserResponse'

        TokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string

        UserResponse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                login:
                    type: string
                role:
                    type: string
                    enum: [USER, ADMIN]
                    
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: jwt
